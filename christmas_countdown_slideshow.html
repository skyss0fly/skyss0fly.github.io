<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#071c2b">
<title>The Countdown to Christmas</title>
<style>
  :root { color-scheme: dark; --gold:#ffd27a; --ice:#bdeaff; }
  * { box-sizing:border-box }
  html,body { margin:0; min-height:100%; background:#061521; color:#fff;
    font-family:Georgia, "Times New Roman", serif; }
  body { min-height:100svh; display:grid; place-items:center; overflow:hidden; }
  .stage { position:relative; width:100%; height:100svh; min-height:520px;
    overflow:hidden; isolation:isolate; background:#071c2b; }
  .slide { position:absolute; inset:0; opacity:0; transition:opacity 1.5s ease;
    background-position:center; background-size:cover; transform:scale(1.035); }
  .slide.active { opacity:1; animation: slowzoom 12s ease-in-out both; }
  @keyframes slowzoom { from { transform:scale(1.035) } to { transform:scale(1.12) } }
  .shade { position:absolute; inset:0; z-index:1;
    background:linear-gradient(180deg,rgba(1,13,23,.25),rgba(1,12,22,.18) 42%,rgba(1,10,18,.72)); }
  .content { position:absolute; z-index:3; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:flex-end; text-align:center;
    padding:clamp(24px,5vw,64px) 20px clamp(42px,8vh,86px); }
  .eyebrow { color:var(--ice); text-transform:uppercase; letter-spacing:.32em;
    font:600 11px/1.5 system-ui,sans-serif; text-shadow:0 2px 15px #001; }
  h1 { margin:12px 0 10px; max-width:900px; font-size:clamp(38px,7vw,82px);
    line-height:.98; font-weight:500; text-shadow:0 4px 30px #001; }
  .subtitle { margin:0 0 26px; color:#fff2d9; font-size:clamp(15px,2vw,21px);
    text-shadow:0 2px 14px #001; }
  .countdown { display:flex; gap:clamp(8px,2vw,20px); flex-wrap:wrap; justify-content:center; }
  .unit { min-width:clamp(68px,11vw,105px); padding:13px 12px 11px;
    border:1px solid rgba(255,231,190,.38); border-radius:14px;
    background:rgba(5,23,35,.48); backdrop-filter:blur(9px);
    box-shadow:0 8px 30px rgba(0,0,0,.18); }
  .number { display:block; color:#fff0ce; font:500 clamp(27px,5vw,43px)/1.1 Georgia,serif;
    font-variant-numeric:tabular-nums; }
  .unit-label { display:block; margin-top:5px; color:#d9edfa;
    font:10px system-ui,sans-serif; letter-spacing:.18em; text-transform:uppercase; }
  .bottom { margin-top:22px; color:rgba(255,255,255,.8);
    font:11px system-ui,sans-serif; letter-spacing:.16em; text-transform:uppercase; }
  .controls { position:absolute; z-index:5; left:0; right:0; top:50%;
    display:flex; justify-content:space-between; padding:0 18px; transform:translateY(-50%);
    pointer-events:none; }
  button { pointer-events:auto; border:1px solid rgba(255,255,255,.35);
    width:44px; height:44px; border-radius:50%; color:white; cursor:pointer;
    background:rgba(4,19,30,.38); backdrop-filter:blur(8px); font-size:24px;
    transition:background .2s, transform .2s; }
  button:hover { background:rgba(4,19,30,.75); transform:scale(1.07); }
  .dots { position:absolute; z-index:5; top:22px; left:0; right:0;
    display:flex; justify-content:center; gap:9px; }
  .dot { width:7px; height:7px; border:0; padding:0; background:rgba(255,255,255,.45); }
  .dot.active { background:var(--gold); box-shadow:0 0 12px var(--gold); }
  .snow { position:absolute; inset:0; z-index:2; pointer-events:none; overflow:hidden; }
  .flake { position:absolute; top:-15px; width:4px; height:4px; border-radius:50%;
    background:rgba(255,255,255,.8); box-shadow:0 0 7px rgba(255,255,255,.7);
    animation:fall linear infinite; }
  @keyframes fall { to { transform:translate3d(35px,110vh,0); opacity:.12 } }
  .pause { position:absolute; z-index:6; right:20px; top:17px; width:auto; height:auto;
    padding:9px 13px; border-radius:20px; font:11px system-ui,sans-serif;
    letter-spacing:.08em; }
  @media (max-height:600px) {
    .content { padding-bottom:22px } h1 { font-size:clamp(32px,6vh,58px) }
    .subtitle { margin-bottom:14px } .bottom { margin-top:12px }
  }
  @media (prefers-reduced-motion:reduce) {
    *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; }
  }
</style>
</head>
<body>
<main class="stage" aria-label="Christmas countdown slideshow">
  <div class="slide active" id="slide0"></div>
  <div class="slide" id="slide1"></div>
  <div class="shade"></div>
  <div class="snow" id="snow"></div>
  <div class="dots" id="dots" aria-label="Choose slide">
    <button class="dot active" aria-label="Show first photo" data-slide="0"></button>
    <button class="dot" aria-label="Show second photo" data-slide="1"></button>
  </div>
  <button class="pause" id="pause" type="button">Ⅱ&nbsp; PAUSE</button>
  <div class="controls">
    <button id="prev" aria-label="Previous slide">‹</button>
    <button id="next" aria-label="Next slide">›</button>
  </div>
  <section class="content">
    <div class="eyebrow">A little winter magic</div>
    <h1>The Countdown<br>to Christmas</h1>
    <p class="subtitle" id="message">The most wonderful time of the year is on its way.</p>
    <div class="countdown" aria-live="off">
      <div class="unit"><span class="number" id="days">000</span><span class="unit-label">Days</span></div>
      <div class="unit"><span class="number" id="hours">00</span><span class="unit-label">Hours</span></div>
      <div class="unit"><span class="number" id="minutes">00</span><span class="unit-label">Minutes</span></div>
      <div class="unit"><span class="number" id="seconds">00</span><span class="unit-label">Seconds</span></div>
    </div>
    <div class="bottom">25 December 2026&nbsp; · &nbsp;Merry Christmas</div>
  </section>
</main>

  ];
  document.getElementById("slide0").style.backgroundImage = `url("${photos[0]}")`;
  document.getElementById("slide1").style.backgroundImage = `url("${photos[1]}")`;

  let current = 0, timer = null, paused = false;
  const slides = [...document.querySelectorAll(".slide")];
  const dots = [...document.querySelectorAll(".dot")];
  function show(index) {
    current = (index + slides.length) % slides.length;
    slides.forEach((s,i) => s.classList.toggle("active", i === current));
    dots.forEach((d,i) => d.classList.toggle("active", i === current));
  }
  function start() {
    clearInterval(timer);
    if (!paused) timer = setInterval(() => show(current + 1), 7000);
  }
  document.getElementById("prev").addEventListener("click", () => { show(current - 1); start(); });
  document.getElementById("next").addEventListener("click", () => { show(current + 1); start(); });
  dots.forEach(d => d.addEventListener("click", () => { show(Number(d.dataset.slide)); start(); }));
  document.getElementById("pause").addEventListener("click", e => {
    paused = !paused;
    e.currentTarget.innerHTML = paused ? "▶&nbsp; PLAY" : "Ⅱ&nbsp; PAUSE";
    start();
  });
  start();

  // Live countdown to Christmas Day in the viewer's local timezone.
  function updateCountdown() {
    const now = new Date();
    const target = new Date(now.getFullYear() === 2026 ? 2026 : (now.getMonth() === 11 && now.getDate() > 25 ? now.getFullYear()+1 : now.getFullYear()), 11, 25, 0, 0, 0);
    const diff = Math.max(0, target - now);
    const d = Math.floor(diff / 86400000);
    const h = Math.floor(diff / 3600000) % 24;
    const m = Math.floor(diff / 60000) % 60;
    const s = Math.floor(diff / 1000) % 60;
    document.getElementById("days").textContent = String(d).padStart(3,"0");
    document.getElementById("hours").textContent = String(h).padStart(2,"0");
    document.getElementById("minutes").textContent = String(m).padStart(2,"0");
    document.getElementById("seconds").textContent = String(s).padStart(2,"0");
    document.getElementById("message").textContent = diff === 0
      ? "Merry Christmas! ✨" : "The most wonderful time of the year is on its way.";
  }
  updateCountdown(); setInterval(updateCountdown, 1000);

  // Lightweight decorative snowfall.
  const snow = document.getElementById("snow");
  for (let i=0; i<42; i++) {
    const f = document.createElement("i");
    f.className = "flake";
    f.style.left = Math.random()*100 + "%";
    f.style.opacity = .25 + Math.random()*.65;
    f.style.width = f.style.height = (2 + Math.random()*4) + "px";
    f.style.animationDuration = (7 + Math.random()*12) + "s";
    f.style.animationDelay = (-Math.random()*18) + "s";
    snow.appendChild(f);
  }
</script>
